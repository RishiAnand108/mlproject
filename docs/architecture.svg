<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style> .title { font: 16px sans-serif; font-weight:600 } .box{ fill:#f5f7fb; stroke:#3b5998; stroke-width:1.5 } .arrow { stroke:#333; stroke-width:2; fill:none; marker-end: url(#arrowhead) }</style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  <text x="20" y="24" class="title">MLProject — High-level pipeline</text>
  <rect x="20" y="40" width="160" height="60" rx="6" class="box"/>
  <text x="40" y="78">Data Ingestion</text>

  <rect x="220" y="40" width="160" height="60" rx="6" class="box"/>
  <text x="250" y="78">Data Transformation</text>

  <rect x="420" y="40" width="160" height="60" rx="6" class="box"/>
  <text x="470" y="78">Model Training (CatBoost)</text>

  <rect x="620" y="40" width="160" height="60" rx="6" class="box"/>
  <text x="660" y="78">Artifacts & Logs</text>

  <path d="M180 70 L220 70" class="arrow"/>
  <path d="M380 70 L420 70" class="arrow"/>
  <path d="M580 70 L620 70" class="arrow"/>

  <text x="20" y="140" class="title">Notes</text>
  <text x="20" y="160" font-size="12">- Code: src/</text>
  <text x="20" y="178" font-size="12">- Notebooks: notebook/</text>
  <text x="20" y="196" font-size="12">- Artifacts: artifacts/, catboost_info/</text>
</svg>
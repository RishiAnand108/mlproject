<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <style> .label{ font:12px sans-serif } .bar{ fill:#4C8BF5 } .axis{ stroke:#333; stroke-width:1 }</style>
  <text x="20" y="24" font-size="16" font-weight="600">Sample Accuracy by Fold</text>
  <g transform="translate(60,40)">
    <line x1="0" y1="200" x2="520" y2="200" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="200" class="axis"/>
    <!-- bars -->
    <rect x="10" y="40" width="60" height="160" class="bar"/>
    <rect x="90" y="80" width="60" height="120" class="bar"/>
    <rect x="170" y="20" width="60" height="180" class="bar"/>
    <rect x="250" y="60" width="60" height="140" class="bar"/>
    <rect x="330" y="30" width="60" height="170" class="bar"/>
    <text x="25" y="220" class="label">Fold1</text>
    <text x="105" y="220" class="label">Fold2</text>
    <text x="185" y="220" class="label">Fold3</text>
    <text x="265" y="220" class="label">Fold4</text>
    <text x="345" y="220" class="label">Fold5</text>
  </g>
</svg>